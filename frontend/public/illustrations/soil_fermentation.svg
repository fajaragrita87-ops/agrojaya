<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ccfbf1" />
      <stop offset="100%" stop-color="#f0fdf4" />
    </linearGradient>
    <linearGradient id="fermentSoilGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a16207" />
      <stop offset="50%" stop-color="#713f12" />
      <stop offset="100%" stop-color="#3f2305" />
    </linearGradient>
  </defs>

  <rect width="800" height="260" fill="url(#skyGrad3)" />
  <rect y="250" width="800" height="250" fill="url(#fermentSoilGrad)" />

  <!-- Organic Compost & Bio-fertilizer Sacks -->
  <g transform="translate(100, 270)">
    <path d="M 0 50 Q 20 0 50 0 Q 80 0 100 50 L 90 90 L 10 90 Z" fill="#d97706" stroke="#b45309" stroke-width="2" />
    <text x="18" y="55" font-family="sans-serif" font-weight="bold" font-size="11" fill="#ffffff">KOMPOS</text>
    <text x="25" y="70" font-family="sans-serif" font-size="9" fill="#ffffff">ORGANIK</text>

    <path d="M 80 50 Q 100 5 130 5 Q 160 5 180 50 L 170 90 L 90 90 Z" fill="#059669" stroke="#047857" stroke-width="2" />
    <text x="105" y="55" font-family="sans-serif" font-weight="bold" font-size="11" fill="#ffffff">BIO-FERMENTASI</text>
  </g>

  <!-- Microbial Activity Sprinkles & Bubbles -->
  <g fill="#fef08a" opacity="0.8">
    <circle cx="200" cy="380" r="6" />
    <circle cx="240" cy="410" r="4" />
    <circle cx="320" cy="370" r="8" />
    <circle cx="450" cy="400" r="5" />
    <circle cx="580" cy="380" r="7" />
    <circle cx="680" cy="420" r="4" />
  </g>

  <!-- Fermentation Heat Waves -->
  <path d="M 180 340 Q 200 320 220 340 T 260 340" stroke="#f59e0b" stroke-width="3" fill="none" opacity="0.7" />
  <path d="M 320 330 Q 340 310 360 330 T 400 330" stroke="#f59e0b" stroke-width="3" fill="none" opacity="0.7" />
  <path d="M 480 340 Q 500 320 520 340 T 560 340" stroke="#f59e0b" stroke-width="3" fill="none" opacity="0.7" />

  <!-- Stage Label Badge -->
  <rect x="30" y="30" width="390" height="60" rx="12" fill="#ffffff" opacity="0.95" stroke="#059669" stroke-width="2" />
  <text x="50" y="55" font-family="sans-serif" font-weight="bold" font-size="16" fill="#0f172a">TAHAP 3: FERMENTASI TANAH & BIO-PUPUK</text>
  <text x="50" y="75" font-family="sans-serif" font-size="12" fill="#059669">Pengayaan Mikroba Organik & Penetrasi Nutrisi Hati</text>
</svg>
