<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <linearGradient id="richSoilGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#92400e" />
      <stop offset="50%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
  </defs>

  <rect width="800" height="280" fill="url(#skyGrad2)" />

  <!-- Sun Rays -->
  <circle cx="120" cy="80" r="45" fill="#f59e0b" opacity="0.9" />

  <!-- Field Horizon -->
  <path d="M 0 240 Q 400 220 800 240 L 800 280 L 0 280 Z" fill="#15803d" opacity="0.4" />

  <!-- Soil Layer -->
  <rect y="270" width="800" height="230" fill="url(#richSoilGrad)" />

  <!-- Furrows / Plowing Ridges -->
  <g stroke="#b45309" stroke-width="6" opacity="0.7">
    <path d="M 50 270 L 0 500" />
    <path d="M 150 270 L 80 500" />
    <path d="M 250 270 L 180 500" />
    <path d="M 350 270 L 290 500" />
    <path d="M 450 270 L 410 500" />
    <path d="M 550 270 L 530 500" />
    <path d="M 650 270 L 660 500" />
    <path d="M 750 270 L 780 500" />
  </g>

  <!-- Plowing Cultivator Equipment -->
  <g transform="translate(300, 220)">
    <!-- Tractor Base -->
    <rect x="0" y="20" width="120" height="45" rx="6" fill="#16a34a" stroke="#14532d" stroke-width="2" />
    <rect x="25" y="-5" width="55" height="30" rx="4" fill="#0f172a" />
    <rect x="30" y="0" width="45" height="20" rx="2" fill="#38bdf8" opacity="0.8" />
    <!-- Rear Large Wheels -->
    <circle cx="20" cy="65" r="28" fill="#1e293b" stroke="#64748b" stroke-width="4" />
    <circle cx="20" cy="65" r="10" fill="#94a3b8" />
    <!-- Front Small Wheels -->
    <circle cx="100" cy="70" r="18" fill="#1e293b" stroke="#64748b" stroke-width="3" />
    <circle cx="100" cy="70" r="6" fill="#94a3b8" />
    <!-- Plow Attachment Blades -->
    <path d="M -40 70 L 0 50 L -10 85 Z" fill="#64748b" stroke="#334155" stroke-width="2" />
    <path d="M -25 70 L 15 50 L 5 85 Z" fill="#64748b" stroke="#334155" stroke-width="2" />
  </g>

  <!-- Stage Label Badge -->
  <rect x="30" y="30" width="370" height="60" rx="12" fill="#ffffff" opacity="0.95" stroke="#059669" stroke-width="2" />
  <text x="50" y="55" font-family="sans-serif" font-weight="bold" font-size="16" fill="#0f172a">TAHAP 2: PENGGARAPAN & PEMBAJAKAN</text>
  <text x="50" y="75" font-family="sans-serif" font-size="12" fill="#059669">Penggemburan & Pembuatan Bedengan Lahan Subur</text>
</svg>
