<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="60%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#f0f9ff" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="soilGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="40%" stop-color="#451a03" />
      <stop offset="100%" stop-color="#27272a" />
    </linearGradient>
    <linearGradient id="foliageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>
  </defs>

  <!-- Sky background -->
  <rect width="800" height="300" fill="url(#skyGrad)" />

  <!-- Tropical Sun -->
  <circle cx="680" cy="90" r="50" fill="url(#sunGrad)" opacity="0.9" />
  <circle cx="680" cy="90" r="65" fill="#fde047" opacity="0.25" />

  <!-- Mountain Background -->
  <path d="M 0 250 Q 200 150 400 230 T 800 210 L 800 300 L 0 300 Z" fill="#047857" opacity="0.3" />
  <path d="M 150 250 Q 380 170 580 240 T 800 230 L 800 300 L 0 300 Z" fill="#065f46" opacity="0.5" />

  <!-- Ground Soil -->
  <rect y="280" width="800" height="220" fill="url(#soilGrad)" />
  
  <!-- Soil Ridges & Clearing Markings -->
  <path d="M 0 330 Q 200 310 400 335 T 800 320" stroke="#92400e" stroke-width="8" fill="none" opacity="0.6" />
  <path d="M 0 380 Q 200 360 400 385 T 800 370" stroke="#78350f" stroke-width="10" fill="none" opacity="0.7" />
  <path d="M 0 430 Q 200 410 400 440 T 800 425" stroke="#451a03" stroke-width="12" fill="none" opacity="0.8" />

  <!-- Clearing Heavy Machinery / Equipment Silhouette (Indonesian Perkebunan) -->
  <g transform="translate(480, 240)">
    <!-- Yellow Tractor Body -->
    <rect x="20" y="40" width="140" height="55" rx="8" fill="#f59e0b" stroke="#b45309" stroke-width="3" />
    <rect x="50" y="10" width="70" height="40" rx="4" fill="#1e293b" />
    <rect x="55" y="15" width="60" height="25" rx="2" fill="#38bdf8" opacity="0.8" />
    <!-- Tracks / Wheels -->
    <rect x="10" y="85" width="160" height="30" rx="15" fill="#334155" />
    <circle cx="35" cy="100" r="10" fill="#94a3b8" />
    <circle cx="70" cy="100" r="10" fill="#94a3b8" />
    <circle cx="105" cy="100" r="10" fill="#94a3b8" />
    <circle cx="140" cy="100" r="10" fill="#94a3b8" />
    <!-- Front Blade -->
    <path d="M -15 60 L 20 60 L 20 105 L -20 100 Z" fill="#64748b" stroke="#334155" stroke-width="2" />
  </g>

  <!-- Trees / Vegetation Boundary -->
  <g transform="translate(20, 160)">
    <ellipse cx="40" cy="80" rx="35" ry="55" fill="url(#foliageGrad)" />
    <ellipse cx="90" cy="70" rx="45" ry="65" fill="#15803d" />
    <ellipse cx="140" cy="85" rx="30" ry="50" fill="#166534" />
    <rect x="35" y="130" width="10" height="40" fill="#78350f" />
    <rect x="85" y="125" width="12" height="45" fill="#78350f" />
  </g>

  <!-- Stage Label Badge Overlay -->
  <rect x="30" y="30" width="340" height="60" rx="12" fill="#ffffff" opacity="0.95" stroke="#059669" stroke-width="2" />
  <text x="50" y="55" font-family="sans-serif" font-weight="bold" font-size="16" fill="#0f172a">TAHAP 1: PEMBUKAAN LAHAN</text>
  <text x="50" y="75" font-family="sans-serif" font-size="12" fill="#059669">Land Clearing & Pembersihan Semak Tropis</text>
</svg>
