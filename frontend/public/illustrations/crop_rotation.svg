<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad8" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="100%" stop-color="#ecfdf5" />
    </linearGradient>
  </defs>

  <rect width="800" height="260" fill="url(#skyGrad8)" />
  <rect y="250" width="800" height="250" fill="#15803d" />

  <!-- Circular Rotation Cycle Arrow -->
  <g transform="translate(400, 240)">
    <path d="M -120 0 A 120 120 0 1 1 120 0 A 120 120 0 1 1 -120 0" stroke="#f59e0b" stroke-width="12" stroke-dasharray="45,15" fill="none" opacity="0.9" />
  </g>

  <!-- Commodity Icons in Rotation Cycle -->
  <!-- Porang -->
  <g transform="translate(250, 160)">
    <rect width="90" height="60" rx="8" fill="#ffffff" stroke="#059669" stroke-width="2" />
    <text x="18" y="35" font-family="sans-serif" font-weight="bold" font-size="14" fill="#047857">PORANG</text>
  </g>

  <!-- Jagung -->
  <g transform="translate(460, 160)">
    <rect width="90" height="60" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="2" />
    <text x="18" y="35" font-family="sans-serif" font-weight="bold" font-size="14" fill="#b45309">JAGUNG</text>
  </g>

  <!-- Melon / Anggur -->
  <g transform="translate(350, 310)">
    <rect width="100" height="60" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2" />
    <text x="14" y="35" font-family="sans-serif" font-weight="bold" font-size="14" fill="#1d4ed8">MELON / ANGGUR</text>
  </g>

  <!-- Stage Label Badge -->
  <rect x="30" y="30" width="430" height="60" rx="12" fill="#ffffff" opacity="0.95" stroke="#059669" stroke-width="2" />
  <text x="50" y="55" font-family="sans-serif" font-weight="bold" font-size="16" fill="#0f172a">TAHAP 8: ROTASI LAHAN & PERGANTIAN TANAMAN</text>
  <text x="50" y="75" font-family="sans-serif" font-size="12" fill="#059669">Strategi Regenerasi Unsur Hara Tanah & Maximize ROI</text>
</svg>
