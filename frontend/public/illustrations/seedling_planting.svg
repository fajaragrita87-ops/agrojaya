<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bfdbfe" />
      <stop offset="100%" stop-color="#ecfdf5" />
    </linearGradient>
    <linearGradient id="plantLeafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
  </defs>

  <rect width="800" height="270" fill="url(#skyGrad4)" />
  <rect y="260" width="800" height="240" fill="#78350f" />

  <!-- Planting Beds / Rows -->
  <path d="M 0 300 L 800 300" stroke="#92400e" stroke-width="20" opacity="0.6" />
  <path d="M 0 380 L 800 380" stroke="#92400e" stroke-width="20" opacity="0.6" />

  <!-- Sprouting Young Seedlings in Rows -->
  <!-- Plant 1 -->
  <g transform="translate(120, 240)">
    <path d="M 30 60 Q 10 20 0 0 Q 30 10 30 60 Z" fill="url(#plantLeafGrad)" />
    <path d="M 30 60 Q 50 20 60 0 Q 30 10 30 60 Z" fill="url(#plantLeafGrad)" />
    <circle cx="30" cy="65" r="8" fill="#15803d" />
  </g>

  <!-- Plant 2 (Center Hero) -->
  <g transform="translate(360, 210)">
    <path d="M 40 80 Q 10 20 0 0 Q 40 10 40 80 Z" fill="url(#plantLeafGrad)" />
    <path d="M 40 80 Q 70 20 80 0 Q 40 10 40 80 Z" fill="url(#plantLeafGrad)" />
    <path d="M 40 80 Q 40 10 40 -15 Q 55 10 40 80 Z" fill="#4ade80" />
    <!-- Polybag base -->
    <rect x="20" y="75" width="40" height="35" rx="4" fill="#1e293b" />
  </g>

  <!-- Plant 3 -->
  <g transform="translate(620, 240)">
    <path d="M 30 60 Q 10 20 0 0 Q 30 10 30 60 Z" fill="url(#plantLeafGrad)" />
    <path d="M 30 60 Q 50 20 60 0 Q 30 10 30 60 Z" fill="url(#plantLeafGrad)" />
    <circle cx="30" cy="65" r="8" fill="#15803d" />
  </g>

  <!-- Certification Tag Seal -->
  <g transform="translate(420, 280)">
    <rect width="90" height="28" rx="6" fill="#f59e0b" stroke="#ffffff" stroke-width="2" />
    <text x="10" y="18" font-family="sans-serif" font-weight="bold" font-size="10" fill="#ffffff">CERTIFIED A+</text>
  </g>

  <!-- Stage Label Badge -->
  <rect x="30" y="30" width="390" height="60" rx="12" fill="#ffffff" opacity="0.95" stroke="#059669" stroke-width="2" />
  <text x="50" y="55" font-family="sans-serif" font-weight="bold" font-size="16" fill="#0f172a">TAHAP 4: PENANAMAN BIBIT UNGGUL</text>
  <text x="50" y="75" font-family="sans-serif" font-size="12" fill="#059669">Penanaman Varietas Sertifikasi Perkebunan Indonesia</text>
</svg>
