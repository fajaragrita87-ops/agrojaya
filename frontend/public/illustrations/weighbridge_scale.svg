<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad7" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
  </defs>

  <rect width="800" height="270" fill="url(#skyGrad7)" />
  <rect y="260" width="800" height="240" fill="#334155" />

  <!-- Weighbridge Platform Deck -->
  <rect x="50" y="270" width="700" height="20" rx="4" fill="#64748b" stroke="#0f172a" stroke-width="3" />

  <!-- Plantation Cargo Truck on Scale -->
  <g transform="translate(180, 140)">
    <!-- Truck Cab -->
    <path d="M 280 40 L 350 40 L 380 90 L 380 140 L 280 140 Z" fill="#dc2626" stroke="#991b1b" stroke-width="3" />
    <rect x="310" y="55" width="55" height="35" rx="3" fill="#38bdf8" opacity="0.85" />
    <!-- Truck Cargo Body loaded with Harvest -->
    <rect x="20" y="20" width="250" height="120" rx="4" fill="#0284c7" stroke="#075985" stroke-width="3" />
    <ellipse cx="145" cy="15" rx="120" ry="20" fill="#ea580c" />
    <!-- Wheels -->
    <circle cx="70" cy="145" r="22" fill="#0f172a" stroke="#475569" stroke-width="4" />
    <circle cx="130" cy="145" r="22" fill="#0f172a" stroke="#475569" stroke-width="4" />
    <circle cx="340" cy="145" r="22" fill="#0f172a" stroke="#475569" stroke-width="4" />
  </g>

  <!-- Digital Scale LED Display Widget -->
  <g transform="translate(480, 40)">
    <rect width="270" height="100" rx="12" fill="#0f172a" stroke="#059669" stroke-width="4" />
    <text x="20" y="35" font-family="monospace" font-weight="bold" font-size="14" fill="#10b981">PKS WEIGHBRIDGE SCALE</text>
    <text x="20" y="75" font-family="monospace" font-weight="extrabold" font-size="32" fill="#22c55e">12,000 KG</text>
    <text x="200" y="75" font-family="sans-serif" font-weight="bold" font-size="14" fill="#f59e0b">NETTO</text>
  </g>

  <!-- Stage Label Badge -->
  <rect x="30" y="30" width="420" height="60" rx="12" fill="#ffffff" opacity="0.95" stroke="#059669" stroke-width="2" />
  <text x="50" y="55" font-family="sans-serif" font-weight="bold" font-size="16" fill="#0f172a">TAHAP 7: PENIMBANGAN DIGITAL TONASE PKS</text>
  <text x="50" y="75" font-family="sans-serif" font-size="12" fill="#059669">Integrasi Timbangan Truk Digital & Verifikasi Tiket PKS</text>
</svg>
