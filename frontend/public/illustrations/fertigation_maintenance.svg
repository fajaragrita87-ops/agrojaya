<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
  </defs>

  <rect width="800" height="260" fill="url(#skyGrad5)" />
  <rect y="250" width="800" height="250" fill="#14532d" />

  <!-- Drip Irrigation Tubing Line -->
  <line x1="0" y1="320" x2="800" y2="320" stroke="#38bdf8" stroke-width="8" stroke-dasharray="15,10" />

  <!-- Water Drops & Fertigation Drips -->
  <g fill="#0284c7">
    <circle cx="150" cy="340" r="5" />
    <circle cx="350" cy="340" r="5" />
    <circle cx="550" cy="340" r="5" />
    <circle cx="750" cy="340" r="5" />
  </g>

  <!-- Mature Growing Palms / Plants -->
  <g transform="translate(100, 100)">
    <!-- Palm fronds -->
    <path d="M 50 150 Q -30 60 -80 70" stroke="#16a34a" stroke-width="12" stroke-linecap="round" fill="none" />
    <path d="M 50 150 Q 130 60 180 70" stroke="#16a34a" stroke-width="12" stroke-linecap="round" fill="none" />
    <path d="M 50 150 Q 20 20 50 -30" stroke="#22c55e" stroke-width="14" stroke-linecap="round" fill="none" />
    <path d="M 50 150 Q 80 20 50 -30" stroke="#22c55e" stroke-width="14" stroke-linecap="round" fill="none" />
    <!-- Trunk -->
    <rect x="35" y="140" width="30" height="120" fill="#78350f" rx="6" />
  </g>

  <!-- Stage Label Badge -->
  <rect x="30" y="30" width="410" height="60" rx="12" fill="#ffffff" opacity="0.95" stroke="#059669" stroke-width="2" />
  <text x="50" y="55" font-family="sans-serif" font-weight="bold" font-size="16" fill="#0f172a">TAHAP 5: PERAWATAN & FERTIGASI PRESISI</text>
  <text x="50" y="75" font-family="sans-serif" font-size="12" fill="#059669">Pemupukan NPK Berjadwal & Irigasi Tetes Otomatis</text>
</svg>
