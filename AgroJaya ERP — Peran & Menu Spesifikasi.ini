5.3 Larangan (Investor = Read-Only)
Dilarang	Keterangan
❌ Input aktivitas	Tidak bisa menambah/edit aktivitas
❌ Edit data master	Tidak bisa mengubah lahan, komoditas, dll
❌ Approve apapun	Tidak ada tombol approve/reject
❌ Kelola user	Tidak bisa melihat/mengelola user lain
❌ Lihat data petani	Tidak bisa melihat nama petani, aktivitas harian petani
❌ Lihat detail HR	Tidak bisa melihat data karyawan, upah, absensi
❌ Edit/delete apapun	Semua aksi hanya baca (read-only)
6. Matriks Perbandingan Role
Menu/Modul	Petani	Kepala Kebun	Manager	Direktur	Investor
Dashboard	✅ (Ringkasan)	✅ (Monitoring)	✅ (Operasional)	✅ (Strategis)	✅ (Financial)
Lahan & Blok	✅ (Lihat sendiri)	✅ (Semua)	✅ (Semua)	✅ (CRUD)	❌
Komoditas	✅ (Lihat)	✅ (Lihat)	✅ (Lihat)	✅ (CRUD)	❌
Aktivitas	✅ (Input + Lihat sendiri)	✅ (Input + Approve)	✅ (Lihat semua)	✅ (Lihat semua)	❌
Inventory	❌	❌	✅ (CRUD)	✅ (CRUD)	❌
Pembelian (PO)	❌	❌	✅ (CRUD + Approve)	✅ (CRUD + Approve)	❌
Tenaga Kerja	✅ (Lihat sendiri)	✅ (Kelola jadwal)	✅ (CRUD)	✅ (CRUD)	❌
Payroll	❌	❌	✅ (CRUD)	✅ (CRUD)	❌
Keuangan	❌	❌	✅ (Lihat)	✅ (CRUD)	✅ (Read-only)
Laporan	❌	✅ (Ke Manager)	✅ (Ke Direktur)	✅ (Semua)	✅ (Read-only)
Analisis	❌	❌	✅	✅	✅ (Read-only)
Audit Trail	❌	❌	❌	✅	✅ (Read-only)
Kontrak Investasi	❌	❌	❌	✅	✅ (Read-only)
User Management	❌	❌	❌	✅	❌
Selesai. Spesifikasi peran & menu ini siap diimplementasikan ke sistem AgroJaya ERP. 🚀

