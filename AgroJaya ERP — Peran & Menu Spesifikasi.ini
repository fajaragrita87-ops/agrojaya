AgroJaya ERP — Peran & Menu Spesifikasi
1. Petani
1.1 Aktivitas
Aktivitas	Deskripsi
Input Aktivitas Harian	Mencatat aktivitas di lapangan (penyiraman, pemupukan, pestisida, dll)
Upload Foto	Dokumentasi aktivitas dengan foto + watermark GPS/timestamp
Lihat Jadwal	Melihat jadwal tugas harian/mingguan per blok
Lihat Blok Tugas	Mengetahui blok mana yang menjadi tanggung jawabnya
Lihat Status Tugas	Melihat tugas yang sudah/selesai dikerjakan
Check-in/Check-out	Absensi masuk/keluar lapangan
1.2 Menu
Menu	Sub-menu	Keterangan
Dashboard	-	Ringkasan tugas hari ini
Aktivitas	Input Aktivitas	Form input aktivitas (jenis, blok, deskripsi, foto)
Riwayat Aktivitas	Daftar aktivitas yang sudah diinput
Jadwal	Tugas Hari Ini	Daftar tugas yang harus dikerjakan hari ini
Tugas Mingguan	Daftar tugas 7 hari ke depan
Blok	Blok Saya	Daftar blok yang menjadi tanggung jawab
Detail Blok	Informasi blok (luas, komoditas, status)
Profil	-	Lihat/edit data pribadi, ubah password
1.3 Larangan
❌ Tidak bisa mengelola data master (lahan, komoditas, inventory)

❌ Tidak bisa melihat data keuangan

❌ Tidak bisa mengelola tenaga kerja lain

❌ Tidak bisa approve/reject apapun

