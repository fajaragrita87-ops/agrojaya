name: agrojaya

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app-agrojaya
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=80
    networks:
      - default
      - proxy_proxy-internal
    expose:
      - "80"

networks:
  default:
  proxy_proxy-internal:
    external: true
