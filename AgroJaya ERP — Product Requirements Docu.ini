AgroJaya ERP — Product Requirements Document (PRD)
1. Project Overview
Atribut	Detail
Nama Proyek	AgroJaya ERP System
Perusahaan	PT Agro Jaya Indonesia
Tujuan	Sistem manajemen pertanian terintegrasi untuk mencatat seluruh siklus tanam, pembelian, tenaga kerja, keuangan, serta menyediakan dashboard berbeda untuk Direktur dan Investor.
Landing Page	Florax Template (gardening & landscape)
Dashboard UI	Turbine UI (light mode only)
Status	Build Custom (bukan beli ERP jadi)
2. Komoditas & Stakeholder
2.1 Komoditas (4 jenis)
Komoditas	Siklus	Catatan Khusus
Porang	8-12 bulan	Berat umbi per lubang, kadar glukomanan
Jagung	3-4 bulan	Kadar air, tonase per hektar
Anggur	Tahunan	Brix (kadar gula), kualitas buah per tangkai
Melon	2-3 bulan	Berat per buah, grade A/B/C, kadar gula
2.2 Peran (5 role)
Role	Akses
Petani	Input aktivitas harian, foto, lihat jadwal sendiri
Kepala Kebun	Approve laporan petani, monitor blok, lihat jadwal tim
Manager	Kelola tenaga kerja, approve PO, lihat laporan keuangan & produksi
Direktur	Semua modul, approve anggaran besar, dashboard penuh
Investor	Read‑only: dashboard keuangan, ROI, proyeksi (tanpa operasional)
3. Arsitektur Teknis
3.1 Tech Stack
Layer	Teknologi	Alasan
Backend	Node.js + Express.js + TypeScript	Ringan, fleksibel, ekosistem luas. Prisma ORM untuk type-safe database
Database	PostgreSQL + PostGIS	Reliable, support GIS untuk peta blok
Frontend Web	React 18 + TypeScript + Vite	Cepat, modern, type-safe
UI Framework	Tailwind CSS + Turbine UI	Light mode only, strict pakai komponen Turbine
Charts	Chart.js	Dashboard Direktur & Investor
Mobile	PWA (Progressive Web App)	Petani pakai browser HP, offline support via Service Worker
Hosting	Vercel (frontend) + AWS/GCP (backend)	Scalable, reliable
