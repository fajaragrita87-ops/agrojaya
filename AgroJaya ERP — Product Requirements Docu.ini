8. Modul Fungsional
8.1 Master Data
Entitas	Field
Lahan/Blok	nama, luas (Ha), jenis tanah, koordinat GIS (PostGIS), status (aktif/panen/kosong)
Komoditas	nama, SOP perawatan (JSON), siklus (hari), formula panen
Input	nama, kategori (bibit/pupuk/pestisida/alat), stock, unit, supplier, harga/unit, min_stock
Tenaga Kerja	nama, email, phone, role, upah, tanggal bergabung
Investor	nama, email, phone, kontrak (JSON), join_date
8.2 Crop Cycle Management
Tahap	Aktivitas	Pencatatan
Persiapan Lahan	Penggarapan, pemupukan dasar, irigasi awal	Foto before/after, biaya (sewa alat, bahan, tenaga kerja)
Penanaman	Tanam bibit	ID tanam per blok, jenis bibit, jumlah, tanggal, petugas, estimasi panen
Perawatan (Harian/Mingguan)	Pemupukan, penyiraman, pestisida, pruning	Biaya operasional harian, foto, cuaca
Panen	Panen hasil	Berat per blok, kualitas, tanggal, tenaga kerja & upah otomatis, link ke stok gudang
Pergantian Tanaman	Tanam ulang	Riwayat tanaman sebelumnya, rekomendasi tanaman selanjutnya, ROI per siklus
8.3 Inventory & Purchase
Fitur	Deskripsi
Purchase Order (PO)	Pembelian bibit, pupuk, alat dengan foto nota
Stok Otomatis	Stok masuk/keluar otomatis terhubung ke aktivitas perawatan
Notifikasi	Peringatan stok menipis (via dashboard & email)
Supplier	Riwayat pembelian per supplier
8.4 HR & Payroll
Fitur	Deskripsi
Absensi	Petani check-in/out via PWA (online/offline)
Perhitungan Upah	Otomatis berdasarkan aktivitas & jam kerja
Jadwal Tugas	Per blok, per komoditas, per petani
8.5 Financial
Fitur	Deskripsi
Jurnal Otomatis	Dari setiap transaksi (pembelian, aktivitas, panen)
Laporan Laba Rugi	Per blok, per komoditas, periode
Budget vs Actual	Per siklus tanam
Cash Flow	Harian/mingguan/bulanan
ROI	Per komoditas, per siklus
Burn Rate	Pengeluaran per bulan, runway
8.6 Dokumentasi & Audit
Fitur	Deskripsi
Foto Aktivitas	Watermark GPS + timestamp, tidak bisa di-edit
Audit Trail	Siapa input/edit apa, kapan, IP address
Export	PDF, Excel
