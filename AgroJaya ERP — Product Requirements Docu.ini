10. API Endpoints
10.1 Authentication
Method	Endpoint	Description
POST	/api/auth/login	Login, return JWT
POST	/api/auth/logout	Logout
GET	/api/auth/me	Get current user
10.2 Lands
Method	Endpoint	Description
GET	/api/lands	List all blok
POST	/api/lands	Create blok
GET	/api/lands/:id	Get blok detail
PUT	/api/lands/:id	Update blok
DELETE	/api/lands/:id	Delete blok
GET	/api/lands/:id/cycles	Get all planting cycles in blok
10.3 Crops
Method	Endpoint	Description
GET	/api/crops	List all crops
POST	/api/crops	Create crop
GET	/api/crops/:id	Get crop detail
PUT	/api/crops/:id	Update crop
10.4 Planting Cycles
Method	Endpoint	Description
GET	/api/cycles	List all cycles
POST	/api/cycles	Start new planting cycle
GET	/api/cycles/:id	Get cycle detail with activities
PUT	/api/cycles/:id	Update cycle
POST	/api/cycles/:id/activities	Add activity
GET	/api/cycles/:id/harvest	Get harvest data
POST	/api/cycles/:id/harvest	Record harvest
10.5 Inventory
Method	Endpoint	Description
GET	/api/inventory	List inventory
POST	/api/inventory	Add inventory item
PUT	/api/inventory/:id	Update stock
GET	/api/inventory/alerts	Get low stock alerts
10.6 Purchases
Method	Endpoint	Description
GET	/api/purchases	List purchases
POST	/api/purchases	Create PO
PUT	/api/purchases/:id/approve	Approve PO (Manager)
10.7 Dashboard
Method	Endpoint	Description
GET	/api/dashboard/direktur	Direktur dashboard data
GET	/api/dashboard/investor	Investor dashboard data (read-only)
10.8 Reports
Method	Endpoint	Description
GET	/api/reports/profit-loss	Laba rugi per blok/komoditas
GET	/api/reports/roi	ROI per komoditas
GET	/api/reports/cashflow	Cash flow
GET	/api/reports/budget-vs-actual	Budget vs actual
GET	/api/reports/export/pdf	Export PDF
GET	/api/reports/export/excel	Export Excel
11. Development Plan
Phase	Duration	Deliverables
Phase 1: Setup	1 minggu	Database schema, API boilerplate, auth, Turbine UI setup, Florax landing page
Phase 2: Core Modules	4 minggu	Lands, Crops, Planting Cycles, Activities, Inventory, Purchases
Phase 3: HR & Finance	2 minggu	Users, roles, payroll, financial recording
Phase 4: Dashboards	2 minggu	Direktur dashboard + Investor dashboard (separate)
Phase 5: Reports & Export	1 minggu	PDF/Excel export, audit trail
Phase 6: Testing & Deployment	1 minggu	Staging, UAT, production
Total MVP: ~3 bulan dengan 2-3 developer

12. Roadmap Fitur Masa Depan
Fase	Waktu	Fitur
Phase 2	6-12 bulan	GIS peta, weather API, budget vs actual, export PDF
Phase 3	1-2 tahun	AI soil/plant analysis, drone imagery, NDVI, traceability QR
Phase 4	2-3 tahun	Precision agriculture, IoT sensors, variable rate application
