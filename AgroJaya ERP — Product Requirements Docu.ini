4. Landing Page (Florax Template)
4.1 Halaman
Halaman	Konten
Home	Hero section, perusahaan overview, value proposition
Tentang	Sejarah, visi misi, tim
Komoditas	4 kartu komoditas (Porang, Jagung, Anggur, Melon) dengan deskripsi singkat
Fitur	Fitur utama sistem ERP (traceability, dashboard, laporan)
Kontak	Form kontak, alamat, nomor telepon
4.2 Design Guidelines
Gunakan template Florax apa adanya (gardening & landscape style).

Warna: hijau alami (sesuai template).

Responsive: mobile-first.

Bahasa: Indonesia.

NO dark mode.

Footer: Copyright PT Agro Jaya Indonesia.

5. Dashboard (Turbine UI — Strict)
5.1 Aturan Main
LIGHT MODE ONLY — tidak boleh ada dark mode.

SEMUA UI harus pakai komponen Turbine — jangan pakai div/button/tabel custom dengan Tailwind.

Dashboard Direktur dan Investor HARUS terpisah — beda file, beda data, beda akses.

Investor adalah read-only — tidak boleh ada tombol aksi (approve, edit, delete) di dashboard investor.

