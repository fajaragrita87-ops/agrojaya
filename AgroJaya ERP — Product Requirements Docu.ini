markdown
# AGROJAYA — TURBINE UI STRICT RULES

## CORE RULES
1. **LIGHT MODE ONLY** — tidak boleh ada dark mode.
2. **SEMUA UI harus pakai komponen Turbine** — jangan pakai div/button/tabel custom dengan Tailwind.
3. **Dashboard Direktur dan Investor HARUS terpisah** — beda file, beda data, beda akses.
4. **Investor adalah read-only** — tidak boleh ada tombol aksi (approve, edit, delete) di dashboard investor.

## KOMPONEN YANG DIPERBOLEHKAN (Turbine UI)
- Layout: <x-t-nav>, <x-t-card>
- Data: <x-t-table>, <x-t-stat>, <x-t-badge>
- Form: <x-t-input>, <x-t-select>, <x-t-label>, <x-t-toggle>
- Aksi: <x-t-button>, <x-t-modal>, <x-t-dropdown>
- Feedback: <x-t-alert>, <x-t-tooltip>

## DILARANG
- `<div class="bg-white shadow rounded-lg">` → gunakan `<x-t-card>`
- `<button class="px-4 py-2 bg-emerald-600">` → gunakan `<x-t-button>`
- `<table>` → gunakan `<x-t-table>`

## DASHBOARD DIREKTUR (file: dashboard-direktur.html)
- Boleh lihat: data operasional, HR, inventory, GIS, cuaca, keuangan
- Boleh aksi: approve, reject, assign, edit

## DASHBOARD INVESTOR (file: dashboard-investor.html)
- TIDAK boleh lihat: nama petani, aktivitas harian, detail HR
- TIDAK boleh aksi: hanya read-only
- Hanya menampilkan: portfolio, ROI, budget vs actual, burn rate, milestone, yield, risk, audit trail, kontrak